          docs_url: https://developers.openai.com/api/reference/resources/responses/methods/create
    transport:
      non_stream: http_json
      stream: sse_json
    response:
      parser: openai_responses
    streaming:
      supported: true
      request_parameter: stream
      request_value: true
    capabilities:
      reasoning:
