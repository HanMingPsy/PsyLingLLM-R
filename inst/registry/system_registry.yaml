schema_version: 2

providers:
  anthropic:
    type: official
    base_url: https://api.anthropic.com
    auth:
      scheme: header
      env_var: ANTHROPIC_API_KEY
      header: x-api-key
    headers:
      Content-Type: application/json
      anthropic-version: "2023-06-01"
    metadata:
      docs_url: https://platform.claude.com/docs/en/api/overview
      models_url: https://platform.claude.com/docs/en/models/overview
      verified_on: "2026-09-16"
  deepseek:
    type: official
    base_url: https://api.deepseek.com
    auth:
      scheme: bearer
      env_var: DEEPSEEK_API_KEY
    headers:
      Content-Type: application/json
    metadata:
      docs_url: https://api-docs.deepseek.com/api/create-chat-completion/
      models_url: https://api-docs.deepseek.com/api/list-models/
      verified_on: "2026-09-16"
  gemini:
    type: official
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    auth:
      scheme: bearer
      env_var: GEMINI_API_KEY
    headers:
      Content-Type: application/json
    metadata:
      docs_url: https://ai.google.dev/gemini-api/docs/openai
      models_url: https://ai.google.dev/gemini-api/docs/models
      compatibility_status: beta
      verified_on: "2026-09-16"
  mistral:
    type: official
    base_url: https://api.mistral.ai/v1
    auth:
      scheme: bearer
      env_var: MISTRAL_API_KEY
    headers:
      Content-Type: application/json
    metadata:
      docs_url: https://docs.mistral.ai/api
      models_url: https://docs.mistral.ai/models
      verified_on: "2026-09-16"
  openai:
    type: official
    base_url: https://api.openai.com/v1
    auth:
      scheme: bearer
      env_var: OPENAI_API_KEY
    headers:
      Content-Type: application/json
    metadata:
      docs_url: https://developers.openai.com/api/reference/resources/responses/methods/create
      models_url: https://developers.openai.com/api/docs/models
      verified_on: "2026-09-16"
  qwen:
