interfaces:
  deepseek-chat-v1:
    protocol: openai_chat
    request:
      builder: openai_chat
      method: POST
      encoding: json
      path: /chat/completions
      default_system: You are a helpful assistant.
      role_mapping:
        system: system
        user: user
        assistant: assistant
      parameters:
        max_tokens:
          description: Native DeepSeek Chat output-token limit.
          docs_url: https://api-docs.deepseek.com/api/create-chat-completion/
        temperature:
          description: Native DeepSeek sampling temperature.
          docs_url: https://api-docs.deepseek.com/api/create-chat-completion/
        thinking:
          description: Native DeepSeek thinking-mode configuration.
          docs_url: https://api-docs.deepseek.com/guides/thinking_mode/
        reasoning_effort:
          description: Native DeepSeek reasoning-effort control.
          docs_url: https://api-docs.deepseek.com/guides/thinking_mode/
    transport:
      non_stream: http_json
      stream: sse_json
    response:
      parser: openai_chat
      selectors:
        answer: [choices, "*", message, content]
        reasoning: [choices, "*", message, reasoning_content]
        request_id: [id]
        object: [object]
        usage_prompt: [usage, prompt_tokens]
        usage_completion: [usage, completion_tokens]
        answer_delta: [choices, "*", delta, content]
        reasoning_delta: [choices, "*", delta, reasoning_content]
    streaming:
      supported: true
      request_parameter: stream
      request_value: true
    capabilities:
      reasoning:
        response_channel: reasoning
    defaults:
      max_tokens: 1024
      temperature: 0.7
    metadata:
      legacy_interface: chat
      legacy_streaming_enabled: true
      docs_url: https://api-docs.deepseek.com/api/create-chat-completion/
      verified_on: "2026-09-07"

  openai-chat-completions-v1:
    protocol: openai_chat
    request:
      builder: openai_chat
      method: POST
      encoding: json
      path: /chat/completions
      default_system: You are a helpful assistant.
      role_mapping:
        system: system
        user: user
        assistant: assistant
      parameters:
        max_tokens:
          description: Legacy-compatible Chat Completions output-token limit.
          docs_url: https://platform.openai.com/docs/api-reference/chat/create
          deprecated: true
          replacement: max_completion_tokens
        max_completion_tokens:
          description: Native Chat Completions output-token limit.
          docs_url: https://platform.openai.com/docs/api-reference/chat/create
        temperature:
          description: Native Chat Completions sampling temperature.
          docs_url: https://platform.openai.com/docs/api-reference/chat/create
    transport:
      non_stream: http_json
      stream: sse_json
    response:
      parser: openai_chat
      selectors:
        answer: [choices, "*", message, content]
        request_id: [id]
        object: [object]
        usage_prompt: [usage, prompt_tokens]
        usage_completion: [usage, completion_tokens]
        answer_delta: [choices, "*", delta, content]
    streaming:
      supported: true
      request_parameter: stream
      request_value: true
    defaults:
      max_tokens: 1024
      temperature: 0.7
    metadata:
      legacy_interface: chat
      legacy_streaming_enabled: true
      docs_url: https://platform.openai.com/docs/api-reference/chat/create
      verified_on: "2026-09-07"

  openai-responses-legacy-v1:
    protocol: legacy_v1
    request:
      builder: legacy_template_v1
      method: POST
      encoding: json
      url: https://api.openai.com/v1/responses
      headers:
        Content-Type: application/json
        Authorization: Bearer ${API_KEY}
      body:
        model: gpt-4o
        input: ${CONTENT}
        ${PARAMETER}: ${VALUE}
      fallback_body:
        model: gpt-4o
        input: ${CONTENT}
        stream: false
      role_mapping:
        system: system
        user: user
        assistant: assistant
      parameter_map:
        stream: stream
        max_output_tokens: max_output_tokens
        temperature: temperature
      defaults:
        max_output_tokens: 1024
        temperature: 0.7
    transport:
      non_stream: http_json
      stream: sse_json
    response:
      parser: legacy_paths_v1
      selectors:
        answer: [output, "*", content, "*", text]
        request_id: [id]
        object: [object]
        answer_delta: [response, output, "*", content, "*", text]
    streaming:
      supported: true
      request_parameter: stream
      request_value: true
    metadata:
      legacy_interface: responses
      legacy_streaming_enabled: true
      docs_url: https://platform.openai.com/docs/api-reference/responses
      verified_on: "2026-09-07"

  openai-responses-v1:
    protocol: openai_responses
    request:
      builder: openai_responses
      method: POST
      encoding: json
      path: /responses
